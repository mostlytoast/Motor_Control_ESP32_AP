; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
lib_extra_dirs =
    ../shared
build_src_filter = 
	+<*.cpp>
	+<*.h>
	-<web/**>
	-<vendor/**>
	-<.pio/**>
lib_deps = 
	bblanchon/ArduinoJson@^7.4.3
	adafruit/Adafruit PN532@^1.3.4
	krulkip/PN532Toolkit@^1.0.1
	esp32async/ESPAsyncWebServer@3.12.1
	esp32async/AsyncTCP@^3.5.0
	lvgl/lvgl@^9.6.0
lib_ignore = 
	ESPAsyncTCP
	RPAsyncTCP
	Async_TCP
	PN532Toolkit
build_flags =
    -I.
    -I../shared
    -I.pio/libdeps/esp32dev/ArduinoJson/src
    -DCORE_DEBUG_LEVEL=3