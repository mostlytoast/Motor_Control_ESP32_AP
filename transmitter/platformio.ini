; TODO have it dynamically select the config files for the pins?
[base_esp32]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; 921600
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv



lib_extra_dirs =
    ../shared
; fix scripts calling dont work right

lib_deps = 
	bblanchon/ArduinoJson@^7.4.3
	adafruit/Adafruit PN532@^1.3.4
	krulkip/PN532Toolkit@^1.0.1
	esp32async/ESPAsyncWebServer@3.12.1
	esp32async/AsyncTCP@^3.5.0
	lvgl/lvgl@^9.6.0
lib_ignore = 
	ESPAsyncTCP
	RPAsyncTCP
	Async_TCP
	PN532Toolkit

test_framework = unity
test_build_src = yes


[env:esp32s3]
extends = base_esp32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1

debug_tool = esp-builtin
debug_init_break = break setup
build_type = debug

upload_protocol = esptool

upload_port = /dev/cu.usbmodem11301
monitor_port = /dev/cu.usbmodem11301
build_flags =
    -I.
    -I../shared
    -I.pio/libdeps/esp32dev/ArduinoJson/src
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_S3


[env:esp32dev]
extends = base_esp32
platform = https://github.com/pioarduino/platform-espressif32
board = esp32dev
upload_port = /dev/cu.usbserial-1130
monitor_port = /dev/cu.usbserial-1130
build_flags =
    -I.
    -I../shared
    -I.pio/libdeps/esp32dev/ArduinoJson/src
    -DCORE_DEBUG_LEVEL=3
    -D BOARD_DEV
