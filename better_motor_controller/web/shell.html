<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Train Controller</title>
    <style>
        :root {
            --bg: #101820;
            --panel: #182633;
            --text: #f5f7fa;
            --muted: #9aa7b4;
            --accent: #00aaff;
            --danger: #cc2222;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app {
            width: min(90vw, 420px);
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.2rem;
            text-align: center;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        label {
            flex: 1;
            color: var(--muted);
            font-size: 0.9rem;
        }

        input {
            flex: 2;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.95rem;
        }

        button {
            background: var(--accent);
            color: #04131d;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
        }

        #status {
            margin-top: 16px;
            color: var(--muted);
            min-height: 20px;
            font-size: 0.85rem;
        }

        canvas {
            display: block;
            margin: 14px auto 0;
            width: 320px;
            height: 240px;
            border-radius: 12px;
            background: #101820;
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>Train Controller</h1>
        <div class="row">
            <label for="esp32-ip">ESP32 URL</label>
            <input id="esp32-ip" value="http://192.168.4.1" />
        </div>
        <div class="row">
            <button id="connect-btn" type="button">Connect</button>
        </div>
        <div id="status">Loading UI…</div>
        <canvas id="canvas" width="320" height="240"></canvas>
    </div>

    <script>
        var Module = {
            canvas: document.getElementById("canvas")
        };
    </script>

    {{{ SCRIPT }}}

    <script>
        (function () {
            const statusEl = document.getElementById('status');
            const ipInput = document.getElementById('esp32-ip');
            const connectBtn = document.getElementById('connect-btn');

            const paramUrl = new URLSearchParams(window.location.search).get('esp32');
            if (paramUrl) {
                ipInput.value = paramUrl;
            }

            function resolveBaseUrl() {
                const value = (ipInput.value || '').trim();
                if (!value) {
                    return window.location.origin;
                }

                return value.endsWith('/') ? value.slice(0, -1) : value;
            }

            function updateStatus(text, isError) {
                statusEl.textContent = text;
                statusEl.style.color = isError ? '#ff8f8f' : '#9aa7b4';
            }

            async function probeController() {
                const base = resolveBaseUrl();
                try {
                    const response = await fetch(base + '/state', { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error('ESP32 not reachable');
                    }
                    updateStatus('Connected to ESP32: ' + base);
                } catch (error) {
                    updateStatus('Waiting for ESP32 at ' + base + '…', true);
                }
            }

            window.__trainUiEndpointBase = resolveBaseUrl();

            window.__trainUiCommandHandler = function (command, value) {
                const base = resolveBaseUrl();
                // todo might remove?
                const endpointMap = {
                    FORWARD: () => fetch(base + '/slider?value=' + value, { method: 'GET' }),
                    REVERSE: () => fetch(base + '/slider?value=' + value, { method: 'GET' }),
                    STOP: () => fetch(base + '/slider?value=0', { method: 'GET' }),
                    RAMP: () => fetch(base + '/ramp?ramp=' + (value / 1000), { method: 'GET' }),
                    LED1: () => fetch(base + '/led1?state=' + (value ? 1 : 0), { method: 'GET' }),
                    LED2: () => fetch(base + '/led2?state=' + (value ? 1 : 0), { method: 'GET' }),
                    AUTO: () => fetch(base + '/auto?state=' + (value ? 1 : 0), { method: 'GET' }),
                    AUDIO: () => fetch(base + '/audio', { method: 'GET' })
                };

                const handler = endpointMap[command];
                if (typeof handler === 'function') {
                    handler().catch((error) => {
                        updateStatus('Command failed: ' + command, true);
                        console.error('[train-ui-rest]', command, value, error);
                    });
                    return;
                }

                console.log('[train-ui]', command, value);
            };

            connectBtn.addEventListener('click', probeController);
            ipInput.addEventListener('change', function () {
                window.__trainUiEndpointBase = resolveBaseUrl();
                probeController();
            });

            probeController();
        })();
    </script>
</body>

</html>
