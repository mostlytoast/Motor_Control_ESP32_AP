<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Train Controller</title>
    <style>
        :root {
            --bg: #101820;
            --panel: #182633;
            --text: #f5f7fa;
            --muted: #9aa7b4;
            --accent: #00aaff;
            --danger: #cc2222;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app {
            width: min(90vw, 420px);
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.2rem;
            text-align: center;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        label {
            flex: 1;
            color: var(--muted);
            font-size: 0.9rem;
        }

        input {
            flex: 2;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.95rem;
        }

        button {
            background: var(--accent);
            color: #04131d;
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
        }

        #status {
            margin-top: 16px;
            color: var(--muted);
            min-height: 20px;
            font-size: 0.85rem;
        }

        canvas {
            display: block;
            margin: 14px auto 0;
            width: 320px;
            height: 240px;
            border-radius: 12px;
            background: #101820;
        }
    </style>
</head>

<body>
    <div id="app">
        <canvas id="canvas" width="320" height="240"></canvas>
    </div>

    <script>
        var Module = {
            canvas: document.getElementById("canvas")
        };
    </script>

    {{{ SCRIPT }}}
</body>

</html>
