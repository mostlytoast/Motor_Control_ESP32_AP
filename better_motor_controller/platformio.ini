; TODO have it dynamically select the config files for the pins?
[base_esp32]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; 921600
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

lib_extra_dirs =
    ../shared
; fix scripts calling dont work right
extra_scripts =
    post:scripts/build_web.py
    post:scripts/upload_all.py
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@^3.5.0

lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP
    Async_TCP
    PN532Toolkit


[env:esp32s3]
extends = base_esp32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1



debug_tool = esp-builtin
debug_init_break = break setup
build_type = debug

upload_protocol = esptool


build_flags =
    -I.
    -I../shared
    -I.pio/libdeps/esp32dev/ArduinoJson/src
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_S3


[env:esp32dev]
extends = base_esp32
platform = https://github.com/pioarduino/platform-espressif32
board = esp32dev

build_flags =
    -I.
    -I../shared
    -I.pio/libdeps/esp32dev/ArduinoJson/src
    -DCORE_DEBUG_LEVEL=3
    -D BOARD_DEV