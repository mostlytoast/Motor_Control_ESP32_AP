[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0

lib_extra_dirs =
    ../shared
; fix scripts calling dont work right
extra_scripts =
    post:scripts/build_web.py
    post:scripts/upload_all.py
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@^3.5.0

lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP
    Async_TCP
    PN532Toolkit

build_flags =
    -I.
    -I../shared
    -I.pio/libdeps/esp32dev/ArduinoJson/src
    -DCORE_DEBUG_LEVEL=3